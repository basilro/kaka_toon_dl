{% extends "base.html" %}
{% block content %}

<div>
  <div class="container-fluid" style="margin-bottom:10px;">
    <div class="row" style="align-items:center;">
      <div class="col-md-12" style="margin-bottom:6px;">
        <button id="b_reload" class="btn btn-sm btn-outline-success">목록 불러오기</button>
        <button id="b_add" class="btn btn-sm btn-primary" disabled>
          스케줄 등록 (<span id="b_sel_count">0</span>)
        </button>
        <span style="margin-left:10px; color:#666;">
          <span id="b_total">0</span>편 ·
          등록됨 <span id="b_reg_count">0</span>편
        </span>
        <span id="b_status" style="margin-left:10px; color:#999;"></span>
      </div>
    </div>
    <div class="row" style="align-items:center; margin-top:4px;">
      <div class="col-md-8" id="b_day_filter" style="margin-bottom:6px;">
        <button class="btn btn-sm btn-outline-secondary b-day" data-day="all">전체</button>
        <button class="btn btn-sm btn-outline-secondary b-day" data-day="월">월</button>
        <button class="btn btn-sm btn-outline-secondary b-day" data-day="화">화</button>
        <button class="btn btn-sm btn-outline-secondary b-day" data-day="수">수</button>
        <button class="btn btn-sm btn-outline-secondary b-day" data-day="목">목</button>
        <button class="btn btn-sm btn-outline-secondary b-day" data-day="금">금</button>
        <button class="btn btn-sm btn-outline-secondary b-day" data-day="토">토</button>
        <button class="btn btn-sm btn-outline-secondary b-day" data-day="일">일</button>
        <button class="btn btn-sm btn-success b-day" data-day="연재">연재중</button>
        <button class="btn btn-sm btn-outline-info b-day" data-day="완결">완결</button>
      </div>
      <div class="col-md-4" style="margin-bottom:6px; text-align:right;">
        <input id="b_search" class="form-control form-control-sm d-inline-block" type="text"
               placeholder="작품/작가 검색" style="width:60%;"/>
        <label style="margin-left:6px; font-weight:normal; white-space:nowrap;">
          <input type="checkbox" id="b_hide_registered"/> 등록 숨김
        </label>
      </div>
    </div>
    <div class="row" style="align-items:center;">
      <div class="col-md-12" style="margin-bottom:6px;">
        <span class="b-flabel">장르</span>
        <span id="b_genre_btns"><button class="btn btn-sm btn-success b-genre" data-genre="all">전체</button></span>
      </div>
    </div>
    <div class="row" style="align-items:center;">
      <div class="col-md-12" style="margin-bottom:6px;">
        <span class="b-flabel">구분</span>
        <button class="btn btn-sm btn-success b-flag" data-flag="all">전체</button>
        <button class="btn btn-sm btn-outline-secondary b-flag" data-flag="new">신작</button>
        <button class="btn btn-sm btn-outline-secondary b-flag" data-flag="up">UP</button>
        <button class="btn btn-sm btn-outline-secondary b-flag" data-flag="waitfree">기다무</button>
        <button class="btn btn-sm btn-outline-secondary b-flag" data-flag="rest">휴재</button>
        <button class="btn btn-sm btn-outline-secondary b-flag" data-flag="adult">19세</button>
        <button class="btn btn-sm btn-outline-secondary b-flag" data-flag="selected">선택한 작품</button>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <label style="font-weight:normal;">
          <input type="checkbox" id="b_check_all"/> 화면에 보이는 항목 전체 선택
        </label>
      </div>
    </div>
  </div>

  <div id="b_grid" class="row" style="margin:0;"></div>
</div>

<div class="modal fade" id="b_detail" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="b_d_title">작품 정보</h5>
        <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body">
        <div class="b-d-wrap">
          <img id="b_d_img" class="b-d-img" referrerpolicy="no-referrer"
               onerror="this.style.visibility='hidden'"/>
          <div class="b-d-info">
            <div id="b_d_meta"></div>
            <div id="b_d_eps" class="b-d-eps"></div>
            <div id="b_d_synopsis" class="b-d-synopsis"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <a id="b_d_link" href="#" target="_blank" rel="noopener noreferrer"
           class="btn btn-sm btn-outline-secondary mr-auto">카카오웹툰에서 보기</a>
        <label id="b_d_sel_wrap" style="margin:0 10px 0 0; font-weight:normal;">
          <input type="checkbox" id="b_d_sel"/> 등록 대상으로 선택
        </label>
        <button type="button" class="btn btn-sm btn-secondary" data-dismiss="modal">닫기</button>
      </div>
    </div>
  </div>
</div>

<style>
.b-card { border:1px solid #e3e3e3; border-radius:6px; padding:8px; margin:6px;
          width:170px; display:flex; flex-direction:column; position:relative; }
.b-card.b-registered { background:#d6ecd6; border-color:#6aa66a; }
.b-card.b-registered .b-name { color:#14431a; }
.b-card.b-registered .b-author { color:#2e6b2e; }
.b-card.b-registered .b-reg-tag { background:#1b7a1b; }
.b-card.b-selected { box-shadow:0 0 0 2px #2d8f2d inset; }
.b-thumb { width:100%; height:96px; object-fit:cover; border-radius:4px; background:#eee; }
.b-name { font-size:13px; font-weight:bold; margin-top:5px; line-height:1.25;
          word-break:break-all; }
.b-author { font-size:11px; color:#777; word-break:break-all; }
.b-badges { margin-top:4px; }
.b-badges .badge { margin-right:2px; }
.b-card .b-check { position:absolute; top:6px; left:6px; transform:scale(1.3); }
.b-reg-tag { position:absolute; top:6px; right:6px; }
.b-card .b-thumb, .b-card .b-name { cursor:pointer; }
.b-d-wrap { display:flex; gap:14px; align-items:flex-start; }
.b-d-img { width:180px; max-height:260px; object-fit:cover; border-radius:6px;
           background:#eee; flex-shrink:0; }
.b-d-info { flex:1; min-width:0; }
.b-d-info .badge { margin-right:3px; }
.b-d-eps { margin:8px 0; font-size:13px; }
.b-d-synopsis { white-space:pre-line; font-size:13px; line-height:1.6;
                border-top:1px solid #eee; padding-top:8px; }
@media (max-width:576px){ .b-d-wrap { flex-direction:column; } .b-d-img { width:100%; } }
.b-flabel { color:#888; font-size:12px; margin-right:6px; display:inline-block; min-width:28px; }
</style>

<script type="text/javascript">
var package_name = "{{ arg['package_name'] }}";
var ALL = [];            // 전체 목록
var REG = {};            // 등록된 contentId set
var REGNAME = {};        // 등록된 제목(정규화) set
var curDay = '연재';   // 기본은 연재중만 (완결작은 '완결'·'전체'에서)
var curGenre = 'all';    // 장르 필터
var curFlag = 'all';     // 구분 필터 (신작·UP·기다무·휴재·19세·선택한 작품)
var SEL = {};            // 체크한 contentId — 다시 그려도(필터·검색·상세 보기·목록 갱신) 유지
var DETAIL = {};         // 상세 정보 캐시 (contentId → item)
var curDetail = null;    // 상세 창에 떠 있는 contentId

function isReg(it){ return !!REG[it.contentId] || !!REGNAME[norm(it.titleName)]; }
function escHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtNum(n){
  if (n == null) return '-';
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '억';
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '만';
  return String(n);
}
// 등록된 작품은 선택 대상에서 빼고, 목록에서 사라진 작품도 정리한다.
function pruneSel(){
  var alive = {};
  ALL.forEach(function(it){ if (!isReg(it)) alive[it.contentId] = true; });
  Object.keys(SEL).forEach(function(k){ if (!alive[k]) delete SEL[k]; });
}

function norm(s){ return (s || '').replace(/\s+/g, '').toLowerCase(); }

function dayBadges(days){
  return (days || []).map(function(d){
    return '<span class="badge badge-light" style="border:1px solid #ddd;">' + d + '</span>';
  }).join('');
}

function cardHtml(it){
  var reg = isReg(it);
  var sel = !reg && !!SEL[it.contentId];
  var cls = 'b-card' + (reg ? ' b-registered' : '') + (sel ? ' b-selected' : '');
  var tags = '';
  if (it['new'])   tags += '<span class="badge badge-success">신작</span>';
  if (it.up)       tags += '<span class="badge badge-info">UP</span>';
  if (it.rest)     tags += '<span class="badge badge-secondary">휴재</span>';
  if (it.waitfree) tags += '<span class="badge badge-warning">기다무</span>';
  if (it.adult)    tags += '<span class="badge badge-danger">19</span>';
  if (it.genre)    tags += '<span class="badge badge-light" style="border:1px solid #ddd;">' + escHtml(it.genre) + '</span>';
  var regTag = reg ? '<span class="b-reg-tag badge badge-success">등록됨</span>' : '';
  return ''
    + '<div class="' + cls + '" data-id="' + it.contentId + '">'
    +   '<input type="checkbox" class="b-check" data-id="' + it.contentId + '"' + (reg ? ' checked disabled' : (sel ? ' checked' : '')) + '/>'
    +   regTag
    +   '<img class="b-thumb" loading="lazy" src="' + (it.thumbnailUrl || '') + '" referrerpolicy="no-referrer" '
    +        'onerror="this.style.visibility=\'hidden\'"/>'
    +   '<div class="b-name" title="클릭하면 상세 정보">' + escHtml(it.titleName || '-') + '</div>'
    +   '<div class="b-author">' + escHtml(it.author || '') + '</div>'
    +   '<div class="b-badges">' + dayBadges(it.days) + ' ' + tags + '</div>'
    + '</div>';
}

// 목록에 실제로 있는 장르만 버튼으로 만든다(작품 수 많은 순). 고른 장르는 유지.
function buildGenres(){
  var cnt = {};
  ALL.forEach(function(it){ var g = it.genre || '기타'; cnt[g] = (cnt[g] || 0) + 1; });
  var names = Object.keys(cnt).sort(function(a, b){ return cnt[b] - cnt[a]; });
  if (curGenre !== 'all' && !cnt[curGenre]) curGenre = 'all';
  var html = '<button class="btn btn-sm ' + (curGenre === 'all' ? 'btn-success' : 'btn-outline-secondary') + ' b-genre" data-genre="all">전체</button> ';
  names.forEach(function(g){
    html += '<button class="btn btn-sm ' + (curGenre === g ? 'btn-success' : 'btn-outline-secondary') + ' b-genre" data-genre="' + escHtml(g) + '">'
         + escHtml(g) + ' <small>' + cnt[g] + '</small></button> ';
  });
  $('#b_genre_btns').html(html);
}

function flagOk(it){
  switch (curFlag){
    case 'new': return !!it['new'];
    case 'up': return !!it.up;
    case 'waitfree': return !!it.waitfree;
    case 'rest': return !!it.rest;
    case 'adult': return !!it.adult;
    case 'selected': return !!SEL[it.contentId];
  }
  return true;
}

function visible(it){
  if (curDay === '연재'){
    if ((it.days || []).indexOf('완결') >= 0) return false;
  } else if (curDay !== 'all' && (it.days || []).indexOf(curDay) < 0) return false;
  if (curGenre !== 'all' && (it.genre || '기타') !== curGenre) return false;
  if (!flagOk(it)) return false;
  if ($('#b_hide_registered').is(':checked') && isReg(it)) return false;
  var q = ($('#b_search').val() || '').trim().toLowerCase();
  if (q){
    var hay = ((it.titleName || '') + ' ' + (it.author || '')).toLowerCase();
    if (hay.indexOf(q) < 0) return false;
  }
  return true;
}

function render(){
  var list = ALL.filter(visible);
  var html = '';
  for (var i = 0; i < list.length; i++) html += cardHtml(list[i]);
  $('#b_grid').html(html || '<div style="padding:20px; color:#999;">표시할 작품이 없습니다.</div>');
  $('#b_total').text(ALL.length);
  $('#b_reg_count').text(ALL.filter(isReg).length);
  updateSel();
}

function updateSel(){
  // 선택 수는 화면에 보이는 것만이 아니라 SEL 전체(필터로 가려진 작품 포함)
  var n = Object.keys(SEL).length;
  $('#b_sel_count').text(n);
  $('#b_add').prop('disabled', n === 0);
  $('.b-card').removeClass('b-selected');
  $('.b-check:checked').each(function(){
    $(this).closest('.b-card').addClass('b-selected');
  });
  if (curDetail != null) $('#b_d_sel').prop('checked', !!SEL[curDetail]);
  var boxes = $('.b-check:not(:disabled)');
  $('#b_check_all').prop('checked', boxes.length > 0 && boxes.filter(':checked').length === boxes.length);
}

function loadList(){
  $('#b_status').text('불러오는 중...');
  $('#b_reload').prop('disabled', true);
  $.post('/' + package_name + '/ajax/basic/command', {command: 'browse_weekday'}, function(data){
    if (data && data.ret === 'success'){
      ALL = data.items || [];
      REG = {}; REGNAME = {};
      (data.registered || []).forEach(function(t){ REG[t] = true; });
      (data.registered_names || []).forEach(function(t){ REGNAME[t] = true; });
      pruneSel();
      $('#b_status').text('갱신됨 (' + ALL.length + '편)');
      buildGenres();
      render();
    } else {
      $('#b_status').text((data && data.msg) || '실패');
      $.notify((data && data.msg) || '목록 조회 실패', {className: 'error'});
    }
  }).fail(function(xhr){
    $('#b_status').text('서버 오류');
    $.notify('서버 호출 실패: ' + xhr.status, {className: 'error'});
  }).always(function(){
    $('#b_reload').prop('disabled', false);
  });
}

$(document).ready(function(){ loadList(); });

$('body').on('click', '#b_reload', function(e){ e.preventDefault(); loadList(); });

$('body').on('click', '.b-day', function(){
  curDay = $(this).data('day');
  $('.b-day').removeClass('btn-success').addClass('btn-outline-secondary');
  $(this).removeClass('btn-outline-secondary').addClass('btn-success');
  render();
});

$('body').on('click', '.b-genre', function(){
  curGenre = String($(this).data('genre'));
  $('.b-genre').removeClass('btn-success').addClass('btn-outline-secondary');
  $(this).removeClass('btn-outline-secondary').addClass('btn-success');
  render();
});

$('body').on('click', '.b-flag', function(){
  curFlag = String($(this).data('flag'));
  $('.b-flag').removeClass('btn-success').addClass('btn-outline-secondary');
  $(this).removeClass('btn-outline-secondary').addClass('btn-success');
  render();
});

$('body').on('input', '#b_search', function(){ render(); });
$('body').on('change', '#b_hide_registered', function(){ render(); });
$('body').on('change', '.b-check', function(){
  var id = $(this).data('id');
  if (this.checked) SEL[id] = true; else delete SEL[id];
  $(this).closest('.b-card').toggleClass('b-selected', this.checked);
  updateSel();
});

$('body').on('change', '#b_check_all', function(){
  var on = this.checked;
  $('.b-check:not(:disabled)').each(function(){
    var id = $(this).data('id');
    $(this).prop('checked', on);
    if (on) SEL[id] = true; else delete SEL[id];
  });
  render();
});

// 카드(체크박스 제외)를 누르면 상세 정보 — 그리드를 다시 그리지 않으므로 체크가 그대로 남는다.
$('body').on('click', '.b-card', function(e){
  if ($(e.target).is('.b-check')) return;
  openDetail($(this).data('id'));
});

$('body').on('change', '#b_d_sel', function(){
  if (curDetail == null) return;
  if (this.checked) SEL[curDetail] = true; else delete SEL[curDetail];
  var $box = $('.b-check[data-id="' + curDetail + '"]');
  $box.prop('checked', this.checked);
  $box.closest('.b-card').toggleClass('b-selected', this.checked);
  updateSel();
});

$('#b_detail').on('hidden.bs.modal', function(){ curDetail = null; });

function openDetail(id){
  var it = ALL.filter(function(x){ return String(x.contentId) === String(id); })[0];
  if (!it) return;
  curDetail = it.contentId;
  var reg = isReg(it);
  $('#b_d_title').text(it.titleName || '작품 정보');
  $('#b_d_img').css('visibility', 'visible').attr('src', it.thumbnailUrl || '');
  $('#b_d_sel_wrap').toggle(!reg);
  $('#b_d_sel').prop('checked', !!SEL[it.contentId]);
  $('#b_d_link').attr('href', 'https://webtoon.kakao.com/content/'
      + (it.seoId ? encodeURIComponent(it.seoId) + '/' : '') + it.contentId);
  $('#b_d_meta').html('<div style="color:#666;">' + escHtml(it.author || '') + '</div>'
      + '<div style="margin-top:4px;">' + dayBadges(it.days)
      + (reg ? ' <span class="badge badge-success">등록됨</span>' : '') + '</div>');
  $('#b_d_eps').html('<span style="color:#999;">불러오는 중...</span>');
  $('#b_d_synopsis').text('');
  $('#b_detail').modal('show');
  if (DETAIL[it.contentId]){ fillDetail(it, DETAIL[it.contentId]); return; }
  $.post('/' + package_name + '/ajax/basic/command',
         {command: 'browse_detail', arg1: it.contentId}, function(data){
    if (data && data.ret === 'success' && data.item){
      DETAIL[it.contentId] = data.item;
      if (String(curDetail) === String(it.contentId)) fillDetail(it, data.item);
    } else if (String(curDetail) === String(it.contentId)){
      $('#b_d_eps').html('<span style="color:#c00;">' + escHtml((data && data.msg) || '상세 정보 조회 실패') + '</span>');
    }
  }).fail(function(xhr){
    if (String(curDetail) === String(it.contentId))
      $('#b_d_eps').html('<span style="color:#c00;">서버 호출 실패: ' + xhr.status + '</span>');
  });
}

function fillDetail(it, d){
  var authors = (d.authors || []).filter(function(a){ return a.role !== '발행'; })
      .map(function(a){ return escHtml(a.name) + (a.role ? ' <small style="color:#999;">' + escHtml(a.role) + '</small>' : ''); });
  var stCls = d.status === '완결' ? 'badge-dark' : (d.status === '휴재' ? 'badge-secondary' : 'badge-primary');
  var reg = isReg(it);
  $('#b_d_meta').html(
      '<div style="color:#666;">' + (authors.join(' · ') || escHtml(it.author || '')) + '</div>'
    + '<div style="margin-top:4px;">'
    +   '<span class="badge ' + stCls + '">' + escHtml(d.status || '') + '</span>'
    +   (d.genre ? '<span class="badge badge-light" style="border:1px solid #ddd;">' + escHtml(d.genre) + '</span>' : '')
    +   (d.adult ? '<span class="badge badge-danger">19</span>' : '')
    +   (it.waitfree ? '<span class="badge badge-warning">기다무</span>' : '')
    +   ' ' + dayBadges(it.days)
    +   (reg ? ' <span class="badge badge-success">등록됨</span>' : '')
    + '</div>'
    + '<div style="margin-top:6px; font-size:12px; color:#777;">조회 ' + fmtNum(d.viewCount)
    +   ' · 좋아요 ' + fmtNum(d.likeCount)
    +   (d.firstDate ? ' · 연재 시작 ' + escHtml(d.firstDate) : '') + '</div>');
  var eps = '';
  if (d.totalEpisodes != null){
    eps = '<b>총 ' + d.totalEpisodes + '화</b>';
    if (d.latestTitle) eps += ' · 최신 ' + escHtml(d.latestTitle)
        + (d.latestDate ? ' (' + escHtml(d.latestDate) + (d.latestUpcoming ? ' 공개 예정' : '') + ')' : '');
    if (d.latestUpcoming) eps += '<div style="font-size:11px; color:#999;">총 회차 수에는 선공개 회차가 포함됩니다.</div>';
  } else {
    eps = '<span style="color:#999;">회차 정보를 가져오지 못했습니다.</span>';
  }
  $('#b_d_eps').html(eps);
  $('#b_d_synopsis').text(d.synopsis || '줄거리 정보가 없습니다.');
  if (d.web) $('#b_d_link').attr('href', d.web);
}

$('body').on('click', '#b_add', function(e){
  e.preventDefault();
  var ids = [], titles = [];
  ALL.forEach(function(it){
    if (SEL[it.contentId] && !isReg(it)){
      ids.push(it.contentId);
      titles.push(it.titleName || '');
    }
  });
  if (ids.length === 0){ $.notify('등록할 작품을 선택하세요', {className: 'warn'}); return; }
  if (!confirm(ids.length + '편을 스케줄(다운로드 목록)에 등록할까요?')) return;
  $('#b_add').prop('disabled', true);
  $.post('/' + package_name + '/ajax/basic/command',
         {command: 'schedule_add', arg1: ids.join(','), arg2: titles.join('\n')}, function(data){
    if (data && data.ret === 'success'){
      $.notify(data.msg || '등록됨', {className: 'success'});
      REG = {}; REGNAME = {};
      (data.registered || []).forEach(function(t){ REG[t] = true; });
      (data.registered_names || []).forEach(function(t){ REGNAME[t] = true; });
      pruneSel();
      render();
    } else {
      $.notify((data && data.msg) || '등록 실패', {className: 'error'});
    }
  }).fail(function(xhr){
    $.notify('서버 호출 실패: ' + xhr.status, {className: 'error'});
  }).always(function(){
    updateSel();
  });
});
</script>
{% endblock %}
